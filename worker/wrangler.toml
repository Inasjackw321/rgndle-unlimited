name = "rngdle-leaderboard"
main = "src/index.js"
compatibility_date = "2024-11-01"

[vars]
# Lock this down to your Pages origin once you know it, e.g.
#   ALLOWED_ORIGIN = "https://your-username.github.io"
ALLOWED_ORIGIN = "*"

# Minimum rank that gets announced to Discord. One of:
#   F D C B A S SS SSS ULTRA Ω
ANNOUNCE_MIN_RANK = "SS"

# REQUIRED. The Worker checks that every Google ID token was issued for *this*
# client; without it a token minted for any other site would be accepted.
# Must stay in step with googleClientId in js/config.js.
GOOGLE_CLIENT_ID = "415975643615-u5mp1cnrltc6bg231hlmklpi4d9m73ud.apps.googleusercontent.com"

# Create with:  npx wrangler kv namespace create RNGDLE
# then paste the returned id below.
[[kv_namespaces]]
binding = "RNGDLE"
id = "replace-me"

# Channel announcements are opt-in and the URL is a secret, never a var, so it
# is not readable from the client:
#   npx wrangler secret put ANNOUNCE_WEBHOOK
